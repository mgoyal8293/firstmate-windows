name: DIAG flake 3
on:
  workflow_dispatch:
  push:
    branches: [fm/winfm-flaky-diag3]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      # Fixed tree only, so the numbers that matter land inside the cap even if
      # the paired baseline run does not. Every step ends on a zero-failure
      # test, so a green step means zero failures.
      - name: FIXED hung-successor case 150x under load
        run: |
          for i in 1 2 3 4; do bash -c 'while :; do :; done' & done
          sleep 1
          fails=0
          for i in $(seq 1 150); do
            if ! out=$(bash .diag/one.sh tests/fm-pi-watch-extension.test.sh test_pi_hung_successor_falls_back_to_typed_wake 2>&1); then
              fails=$((fails+1)); echo "### FAIL run $i"; echo "$out"
            fi
          done
          kill %1 %2 %3 %4 2>/dev/null || true
          echo "FIXED_PI_HUNG=$fails/150"
          [ "$fails" -eq 0 ]
      - name: FIXED OpenCode hung-successor case 150x under load
        if: always()
        run: |
          for i in 1 2 3 4; do bash -c 'while :; do :; done' & done
          sleep 1
          fails=0
          for i in $(seq 1 150); do
            if ! out=$(bash .diag/one.sh tests/fm-pi-watch-extension.test.sh test_opencode_hung_successor_falls_back_to_typed_wake 2>&1); then
              fails=$((fails+1)); echo "### FAIL run $i"; echo "$out"
            fi
          done
          kill %1 %2 %3 %4 2>/dev/null || true
          echo "FIXED_OC_HUNG=$fails/150"
          [ "$fails" -eq 0 ]
      - name: FIXED whole file 25x under load
        if: always()
        run: |
          for i in 1 2 3 4; do bash -c 'while :; do :; done' & done
          sleep 1
          fails=0
          for i in $(seq 1 25); do
            if ! out=$(bash tests/fm-pi-watch-extension.test.sh 2>&1); then
              fails=$((fails+1)); echo "### FILE FAIL $i"; echo "$out" | grep -E "not ok" || true
            fi
          done
          kill %1 %2 %3 %4 2>/dev/null || true
          echo "FIXED_WHOLE_FILE=$fails/25"
          [ "$fails" -eq 0 ]
      - name: Cost check - fixed vs baseline whole file, 20x unloaded, timed
        if: always()
        run: |
          fails=0
          start=$(date +%s)
          for i in $(seq 1 20); do
            if ! out=$(bash tests/fm-pi-watch-extension.test.sh 2>&1); then
              fails=$((fails+1)); echo "### FIXED FILE FAIL $i"; echo "$out" | grep -E "not ok" || true
            fi
          done
          echo "FIXED_WHOLE_FILE_UNLOADED=$fails/20 elapsed=$(( $(date +%s) - start ))s"
          bfails=0
          bstart=$(date +%s)
          for _ in $(seq 1 20); do
            if ! bash .diag/baseline-fm-pi-watch-extension.test.sh >/dev/null 2>&1; then
              bfails=$((bfails+1))
            fi
          done
          echo "BASELINE_WHOLE_FILE_UNLOADED=$bfails/20 elapsed=$(( $(date +%s) - bstart ))s"
          [ "$fails" -eq 0 ]
