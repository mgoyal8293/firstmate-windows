name: Windows Herdr automation spike

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: LF detector probe 2
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out with LF line endings
        run: |
          set -eu
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: argv bytes for each pattern form
        run: |
          set +e
          dump="$RUNNER_TEMP/argvdump.sh"
          printf '#!/bin/sh\nn=0\nfor a in "$@"; do n=$((n+1)); printf "  argv[%%s]=" "$n"; printf "%%s" "$a" | od -An -c | tr -d "\\n"; printf "\\n"; done\n' > "$dump"
          chmod +x "$dump"
          echo "--- form A: inline \$'\\r' unquoted ---"
          "$dump" -rlU $'\r' bin tests --include='*.sh'
          echo "--- form H: variable, double-quoted ---"
          p=$'\r'
          echo "   len p = ${#p}"
          "$dump" -rlU "$p" bin tests --include='*.sh'
          echo "--- form I: -e inline ---"
          "$dump" -rlU -e $'\r' bin tests --include='*.sh'
          echo "--- form G: \$'\\015' ---"
          "$dump" -rlU $'\015' bin tests --include='*.sh'
          echo "--- printf-substitution form ---"
          q=$(printf '\r')
          echo "   len q = ${#q}"
          "$dump" -rlU "$q" bin tests --include='*.sh'

      - name: same detectors, single file, no -r
        run: |
          set +e
          f=bin/fm-lint.sh
          echo "CR bytes in $f (perl): $(perl -0777 -ne 'my $n = () = /\r/g; print $n' < "$f")"
          echo "first 32 bytes:"; od -c "$f" | head -2
          echo
          echo "A-single) grep -lU \$'\\r' $f"; grep -lU $'\r' "$f"; echo "   rc=$?"
          echo "H-single) p=\$'\\r'; grep -lU \"\$p\" $f"; p=$'\r'; grep -lU "$p" "$f"; echo "   rc=$?"
          echo "count A-single: $(grep -cU $'\r' "$f")"
          echo "count H-single: $(grep -cU "$p" "$f")"
          echo "count empty:    $(grep -c '' "$f")"

      - name: A and H in BOTH directories
        run: |
          set +e
          run_forms() {
            echo "  A inline : count=$(grep -rlU $'\r' bin tests --include='*.sh' | wc -l | tr -d ' ') rc=$?"
            local p=$'\r'
            echo "  H varquot: count=$(grep -rlU "$p" bin tests --include='*.sh' | wc -l | tr -d ' ')"
            echo "  perl     : count=$(find bin tests -name '*.sh' -print0 | xargs -0 perl -0777 -ne 'print $ARGV,"\n" if /\r/' | wc -l | tr -d ' ')"
            echo "  empty ctl: count=$(grep -rl '' bin tests --include='*.sh' | wc -l | tr -d ' ')"
          }
          echo "=== REPO tree ($PWD) - ground truth 0 CR ==="
          run_forms
          d="$RUNNER_TEMP/lfprobe2"
          rm -rf "$d"; mkdir -p "$d/bin" "$d/tests"
          printf 'echo lf\n' > "$d/bin/clean.sh"
          printf 'echo lf2\n' > "$d/tests/clean.test.sh"
          printf 'echo crlf\r\n' > "$d/bin/dirty.sh"
          echo
          echo "=== FIXTURE tree ($d) - ground truth 1 of 3 has CR ==="
          ( cd "$d" && run_forms )
          echo
          echo "=== REPO tree with ONE deliberate CRLF file added ==="
          printf 'echo deliberate\r\n' > tests/zz-crlf-probe.test.sh
          run_forms
          rm -f tests/zz-crlf-probe.test.sh

      - name: does the repo tree contain anything grep calls binary
        run: |
          set +e
          echo "files with NUL bytes under bin/tests *.sh:"
          find bin tests -name '*.sh' -print0 | xargs -0 perl -0777 -ne 'print $ARGV, "\n" if /\0/' | head
          echo "(blank = none)"
          echo "grep -rlU \$'\\r' but only bin:  $(grep -rlU $'\r' bin --include='*.sh' | wc -l | tr -d ' ')"
          echo "grep -rlU \$'\\r' but only tests: $(grep -rlU $'\r' tests --include='*.sh' | wc -l | tr -d ' ')"
          echo "grep -rlU with --include BEFORE paths: $(grep -rlU --include='*.sh' $'\r' bin tests | wc -l | tr -d ' ')"
          echo "grep -rlU no --include at all on bin: $(grep -rlU $'\r' bin | wc -l | tr -d ' ')"

      - name: candidate replacements, BOTH directions, on the runner
        run: |
          set +e
          # A tree that is provably LF, and the same tree with one real CRLF file.
          d="$RUNNER_TEMP/lfcand"
          rm -rf "$d"; mkdir -p "$d/bin" "$d/tests"
          printf 'echo one\necho two\n' > "$d/bin/a.sh"
          printf 'echo three\n'         > "$d/tests/b.test.sh"
          cand_perl() { find bin tests -name '*.sh' -print0 | xargs -0 perl -0777 -ne 'print $ARGV, "\n" if /\r/'; }
          cand_grepP() { grep -rlUP '\r' bin tests --include='*.sh'; }
          cand_awk()  { find bin tests -name '*.sh' -exec awk '/\r/ { print FILENAME; nextfile }' {} + ; }
          report() {
            echo "  perl  -> [$(cand_perl | tr '\n' ' ')]"
            echo "  grepP -> [$(cand_grepP | tr '\n' ' ')]"
            echo "  awk   -> [$(cand_awk | tr '\n' ' ')]"
          }
          echo "=== CLEAN fixture: every candidate must report NOTHING ==="
          ( cd "$d" && report )
          printf 'echo crlf\r\necho more\r\n' > "$d/bin/dirty.sh"
          echo
          echo "=== SAME fixture + one real CRLF file: every candidate must report ONLY bin/dirty.sh ==="
          ( cd "$d" && report )
          echo
          echo "=== REAL REPO tree (provably 0 CR): every candidate must report NOTHING ==="
          report
          echo
          echo "=== REAL REPO tree + one deliberate CRLF file: must report ONLY that file ==="
          printf 'echo deliberate\r\n' > tests/zz-crlf-probe.test.sh
          report
          rm -f tests/zz-crlf-probe.test.sh
          echo
          echo "perl exit status when nothing found (perl always exits 0 - the caller must judge output):"
          ( cd "$d" && cand_perl >/dev/null; echo "  rc=$?" )
