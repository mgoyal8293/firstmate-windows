name: Windows Herdr automation spike

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: LF detector probe
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out with LF line endings
        run: |
          set -eu
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Environment
        run: |
          set +e
          echo "MSYSTEM=${MSYSTEM:-unset}"
          echo "bash: $BASH_VERSION"
          echo "BASH: $BASH"
          echo "which grep: $(command -v grep)"
          grep --version | head -1
          echo "which perl: $(command -v perl)"
          echo "which tr:   $(command -v tr)"
          echo "--- locale ---"
          locale
          echo "LANG=${LANG:-unset} LC_ALL=${LC_ALL:-unset}"
          echo "--- git ---"
          git --version
          echo "--- PATH ---"
          printf '%s\n' "$PATH" | tr ':' '\n'
          echo "--- this step script's own line endings ---"
          echo "script arg0=$0"
          od -c "$0" | head -3
          crcount=$(perl -0777 -ne 'my $n = () = /\r/g; print $n' < "$0")
          echo "CR bytes in this step script file: $crcount"

      - name: Pattern bytes
        run: |
          set +e
          printf '%s' $'\r' | od -c
          echo "length of \$'\\r' = ${#BASH_REMATCH}"
          p=$'\r'
          echo "len p = ${#p}"
          printf '%s' "$p" | od -c

      - name: Ground truth on the checked-out tree
        run: |
          set +e
          total=$(find bin tests -name '*.sh' | wc -l | tr -d ' ')
          echo "tracked *.sh under bin+tests: $total"
          echo "--- perl ground truth: files containing CR ---"
          perlhits=$(find bin tests -name '*.sh' -print0 | xargs -0 perl -0777 -ne 'print $ARGV, "\n" if /\r/' | wc -l | tr -d ' ')
          echo "perl CR-carrying files: $perlhits"
          echo "--- tr ground truth: total CR bytes across all of them ---"
          trbytes=$(find bin tests -name '*.sh' -exec cat {} + | tr -dc '\r' | wc -c | tr -d ' ')
          echo "total CR bytes (tr): $trbytes"

      - name: Detectors on the checked-out tree
        run: |
          set +e
          echo "A) grep -rlU \$'\\r' bin tests --include='*.sh'"
          a=$(grep -rlU $'\r' bin tests --include='*.sh'); arc=$?
          echo "   rc=$arc count=$(printf '%s' "$a" | grep -c . )"
          printf '%s\n' "$a" | head -3 | sed 's/^/   /'
          echo
          echo "B) grep -rl '' bin tests --include='*.sh'   [empty-pattern CONTROL]"
          b=$(grep -rl '' bin tests --include='*.sh'); brc=$?
          echo "   rc=$brc count=$(printf '%s' "$b" | grep -c . )"
          echo
          echo "C) LC_ALL=C grep -rlU \$'\\r' ..."
          c=$(LC_ALL=C grep -rlU $'\r' bin tests --include='*.sh'); crc=$?
          echo "   rc=$crc count=$(printf '%s' "$c" | grep -c . )"
          echo
          echo "D) grep -rlUP '\\r' ..."
          d=$(grep -rlUP '\r' bin tests --include='*.sh' 2>&1); drc=$?
          echo "   rc=$drc count=$(printf '%s' "$d" | grep -c . )"
          printf '%s\n' "$d" | head -2 | sed 's/^/   /'
          echo
          echo "E) grep -rlU --binary-files=text \$'\\r' ..."
          e=$(grep -rlU --binary-files=text $'\r' bin tests --include='*.sh'); erc=$?
          echo "   rc=$erc count=$(printf '%s' "$e" | grep -c . )"
          echo
          echo "F) perl detector"
          f=$(find bin tests -name '*.sh' -print0 | xargs -0 perl -0777 -ne 'print $ARGV, "\n" if /\r/')
          echo "   count=$(printf '%s' "$f" | grep -c . )"
          echo
          echo "G) grep -rlU \$'\\015' ..."
          g=$(grep -rlU $'\015' bin tests --include='*.sh'); grc=$?
          echo "   rc=$grc count=$(printf '%s' "$g" | grep -c . )"
          echo
          echo "H) pattern via variable: p=\$'\\r'; grep -rlU \"\$p\" ..."
          p=$'\r'
          h=$(grep -rlU "$p" bin tests --include='*.sh'); hrc=$?
          echo "   rc=$hrc count=$(printf '%s' "$h" | grep -c . )"
          echo
          echo "I) grep -rlU -e \$'\\r' ..."
          i=$(grep -rlU -e $'\r' bin tests --include='*.sh'); irc=$?
          echo "   rc=$irc count=$(printf '%s' "$i" | grep -c . )"

      - name: Discrimination fixture - one LF file, one CRLF file
        run: |
          set +e
          d="$RUNNER_TEMP/lfprobe"
          rm -rf "$d"; mkdir -p "$d/bin" "$d/tests"
          printf 'echo lf-one\necho lf-two\n'     > "$d/bin/clean.sh"
          printf 'echo lf-three\n'                > "$d/tests/clean.test.sh"
          printf 'echo crlf-one\r\necho crlf\r\n' > "$d/bin/dirty.sh"
          cd "$d" || exit 1
          echo "ground truth per file:"
          for f in bin/clean.sh tests/clean.test.sh bin/dirty.sh; do
            echo "  $f CR=$(tr -dc '\r' < "$f" | wc -c | tr -d ' ')"
          done
          echo
          echo "A) grep -rlU \$'\\r'  [must list ONLY bin/dirty.sh]"
          grep -rlU $'\r' bin tests --include='*.sh' | sed 's/^/   /'
          echo
          echo "B) grep -rl '' [CONTROL, lists all 3]"
          grep -rl '' bin tests --include='*.sh' | sed 's/^/   /'
          echo
          echo "F) perl  [must list ONLY bin/dirty.sh]"
          find bin tests -name '*.sh' -print0 | xargs -0 perl -0777 -ne 'print $ARGV, "\n" if /\r/' | sed 's/^/   /'
          echo
          echo "and after tr -d: perl must list NOTHING"
          for f in bin/dirty.sh; do tr -d '\r' < "$f" > "$f.tmp" && cat "$f.tmp" > "$f" && rm -f "$f.tmp"; done
          echo "A after strip:"; grep -rlU $'\r' bin tests --include='*.sh' | sed 's/^/   /'
          echo "F after strip:"; find bin tests -name '*.sh' -print0 | xargs -0 perl -0777 -ne 'print $ARGV, "\n" if /\r/' | sed 's/^/   /'
          echo "(both blank = correct)"
