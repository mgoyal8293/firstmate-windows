name: DIAG flake
on:
  workflow_dispatch:
  push:
    branches: [fm/winfm-flaky-diag]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      # Each step must FAIL on any failure. The previous round ended every step
      # with an echo under `set +e`, so the step exit code was the echo's and
      # the job went green while the counters showed real failures.
      - name: Fixed hung-successor case 150x under load
        run: |
          for i in 1 2 3 4; do bash -c 'while :; do :; done' & done
          sleep 1
          fails=0
          for i in $(seq 1 150); do
            if ! out=$(bash .diag/one.sh test_pi_hung_successor_falls_back_to_typed_wake 2>&1); then
              fails=$((fails+1)); echo "### FAIL run $i"; echo "$out"
            fi
          done
          kill %1 %2 %3 %4 2>/dev/null || true
          echo "PI_HUNG=$fails/150"
          [ "$fails" -eq 0 ]
      - name: Fixed session-lock case 150x under load
        if: always()
        run: |
          for i in 1 2 3 4; do bash -c 'while :; do :; done' & done
          sleep 1
          fails=0
          for i in $(seq 1 150); do
            if ! out=$(bash .diag/one.sh test_opencode_primary_watch_plugin_requires_session_lock 2>&1); then
              fails=$((fails+1)); echo "### FAIL run $i"; echo "$out"
            fi
          done
          kill %1 %2 %3 %4 2>/dev/null || true
          echo "SESSION_LOCK=$fails/150"
          [ "$fails" -eq 0 ]
      - name: Fixed whole file 25x under load
        if: always()
        run: |
          for i in 1 2 3 4; do bash -c 'while :; do :; done' & done
          sleep 1
          fails=0
          for i in $(seq 1 25); do
            if ! out=$(bash tests/fm-pi-watch-extension.test.sh 2>&1); then
              fails=$((fails+1)); echo "### FILE FAIL $i"; echo "$out" | grep -E "not ok" || true
            fi
          done
          kill %1 %2 %3 %4 2>/dev/null || true
          echo "WHOLE_FILE=$fails/25"
          [ "$fails" -eq 0 ]
      - name: Fixed operational-input suite 25x under load
        if: always()
        run: |
          for i in 1 2 3 4; do bash -c 'while :; do :; done' & done
          sleep 1
          fails=0
          for i in $(seq 1 25); do
            if ! out=$(bash tests/fm-operational-input.test.sh 2>&1); then
              fails=$((fails+1)); echo "### FAIL $i"; echo "$out" | grep -E "not ok" || true
            fi
          done
          kill %1 %2 %3 %4 2>/dev/null || true
          echo "OPERATIONAL_INPUT=$fails/25"
          [ "$fails" -eq 0 ]
