name: DIAG flake
on:
  workflow_dispatch:
  push:
    branches: [fm/winfm-flaky-diag]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Runner shape
        run: |
          nproc; free -m; cat /proc/loadavg
      - name: Load-sensitivity curve for child process start
        run: node .diag/loadcurve.mjs
      - name: Failing case 150x under representative load
        run: |
          set +e
          for i in 1 2 3 4; do bash -c 'while :; do :; done' & done
          sleep 1
          fails=0
          for i in $(seq 1 150); do
            out=$(bash .diag/one.sh test_pi_hung_successor_falls_back_to_typed_wake 2>&1)
            if [ $? -ne 0 ]; then fails=$((fails+1)); echo "### FAIL run $i"; echo "$out"; fi
          done
          kill %1 %2 %3 %4 2>/dev/null
          echo "PI_HUNG_LOADED_FAILS=$fails/150"
      - name: Whole file 10x under representative load
        run: |
          set +e
          for i in 1 2 3 4; do bash -c 'while :; do :; done' & done
          sleep 1
          fails=0
          for i in $(seq 1 10); do
            out=$(bash tests/fm-pi-watch-extension.test.sh 2>&1)
            if [ $? -ne 0 ]; then fails=$((fails+1)); echo "### FILE FAIL $i"; echo "$out" | grep -E "not ok|NODEERR" ; fi
          done
          kill %1 %2 %3 %4 2>/dev/null
          echo "WHOLE_FILE_LOADED_FAILS=$fails/10"
